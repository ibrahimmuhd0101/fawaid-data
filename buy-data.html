<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy Data | FAWAID DATA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      color: #111;
    }

    header {
      background: #0b8f4d;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 900;
    }

    .back {
      background: white;
      color: #0b8f4d;
      border: none;
      padding: 10px 15px;
      border-radius: 20px;
      font-weight: bold;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 30px 6%;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.07);
    }

    h1 {
      margin-top: 0;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    .price {
      background: #f0f8f3;
      color: #0b8f4d;
      padding: 16px;
      margin-top: 20px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 20px;
    }

    button.continue {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #0b8f4d;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>

  <div class="logo">FAWAID DATA</div>

  <button class="back" id="back">
    ← Dashboard
  </button>

</header>

<main>

  <div class="card">

    <h1>Buy Data 📱</h1>

    <p class="subtitle">
      Choose a network and data plan.
    </p>

    <form id="dataForm">

      <label for="phone">
        Phone Number
      </label>

      <input
        id="phone"
        type="tel"
        placeholder="08012345678"
        maxlength="11"
        required
      >

      <label for="network">
        Network
      </label>

      <select id="network" required>

        <option value="">
          Select Network
        </option>

        <option value="MTN">
          🟡 MTN
        </option>

        <option value="Airtel">
          🔴 Airtel
        </option>

        <option value="GLO">
          🟢 GLO
        </option>

        <option value="9mobile">
          🔵 9mobile
        </option>

      </select>

      <label for="plan">
        Data Plan
      </label>

      <select id="plan" required>

        <option value="">
          Select Data Plan
        </option>

        <option value="500MB">
          500MB
        </option>

        <option value="1GB">
          1GB
        </option>

        <option value="2GB">
          2GB
        </option>

        <option value="5GB">
          5GB
        </option>

        <option value="10GB">
          10GB
        </option>

      </select>

      <div class="price">
        Price: ₦<span id="price">0.00</span>
      </div>

      <button class="continue" type="submit">
        Continue
      </button>

    </form>

    <div id="message"></div>

  </div>

</main>

<script type="module">

  import { auth } from "./firebase.js";

  import {
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  const form =
    document.getElementById("dataForm");

  const message =
    document.getElementById("message");

  const price =
    document.getElementById("price");

  const plans = {
    "500MB": 0,
    "1GB": 0,
    "2GB": 0,
    "5GB": 0,
    "10GB": 0
  };

  document
    .getElementById("plan")
    .addEventListener("change", function () {

      price.textContent =
        plans[this.value].toFixed(2);

    });

  onAuthStateChanged(auth, (user) => {

    if (!user) {
      window.location.href = "login.html";
    }

  });

  form.addEventListener("submit", (event) => {

    event.preventDefault();

    message.style.color = "#0b8f4d";

    message.textContent =
      "Data ordering will be activated after we connect the payment and VTU provider.";

  });

  document
    .getElementById("back")
    .addEventListener("click", () => {

      window.location.href = "dashboard.html";

    });

</script>

</body>
</html>
