<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | FAWAID DATA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      color: #0b8f4d;
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #0b8f4d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: 12px;
      color: #0b8f4d;
      font-size: 14px;
      text-decoration: none;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .register {
      text-align: center;
      margin-top: 22px;
      color: #666;
    }

    .register a {
      color: #0b8f4d;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">FAWAID DATA</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Login to your FAWAID DATA account
    </p>

    <form id="loginForm">

      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        placeholder="Enter your password"
        required
      >

      <a class="forgot" href="#">
        Forgot Password?
      </a>

      <button id="loginButton" type="submit">
        Log In
      </button>

    </form>

    <div id="message"></div>

    <div class="register">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

  </div>

  <script type="module">

    import { auth } from "./firebase.js";

    import {
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    const form =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("loginButton");

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      message.textContent = "";

      button.disabled = true;
      button.textContent = "Logging in...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        message.style.color = "#0b8f4d";

        message.textContent =
          "Login successful!";

        setTimeout(() => {

          window.location.href = "window.location.href = "dashboard.html";

        }, 800);

      } catch (error) {

        message.style.color = "red";

        if (
          error.code ===
          "auth/invalid-credential"
        ) {

          message.textContent =
            "Incorrect email or password.";

        } else {

          message.textContent =
            "Login failed. Please try again.";

        }

      } finally {

        button.disabled = false;
        button.textContent = "Log In";

      }

    });

  </script>

</body>
</html>
